<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zinseszinsrechner – Rechner &amp; Tools</title>
    <meta name="description" content="Wie wirkt sich der Zinseszinseffekt auf Ihre Geldanlage aus? Simulation des Kapitalwachstums bei Einmalanlage oder Sparplan.">

    <!-- Google Fonts: Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- CSS Tailwind Base -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom Styling -->
    <style>
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }

        /* Back navigation */
        .back-nav {
            max-width: 1280px;
            margin: 0 auto;
            padding: 20px 24px 0;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-family: 'Roboto', sans-serif;
            font-size: 13.5px;
            font-weight: 500;
            color: #646464;
            text-decoration: none;
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px 0;
            transition: color 0.15s;
        }
        .back-btn svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.15s;
        }
        .back-btn:hover { color: #023e84; }
        .back-btn:hover svg { transform: translateX(-2px); }

        /* Eyebrow Badge */
        .page-eyebrow {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #006fb9;
            background: #e8f0fa;
            padding: 4px 14px;
            border-radius: 20px;
            margin-bottom: 10px;
        }

        input[type=range] {
            appearance: none;
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: #e5e7eb;
            border-radius: 3px;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: #023e84;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 4px rgba(2, 62, 132, 0.25);
            border: none;
            transition: all 0.15s ease;
        }

        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.12);
            box-shadow: 0 3px 6px rgba(2, 62, 132, 0.35);
        }

        input[type=range]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            background: #023e84;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 4px rgba(2, 62, 132, 0.25);
            border: none;
            transition: all 0.15s ease;
        }

        input[type=range]::-moz-range-thumb:hover {
            transform: scale(1.12);
            box-shadow: 0 3px 6px rgba(2, 62, 132, 0.35);
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 24px;
            font-size: 13px;
            color: #94a3b8;
            border-top: 1px solid #f1f5f9;
        }
    </style>

    <!-- React Dependencies -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/prop-types@15.6/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.2/umd/Recharts.js"></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body class="min-h-screen bg-white py-0 px-0">

    <!-- BACK NAVIGATION -->
    <nav class="back-nav">
        <a href="../../index.html" class="back-btn" id="btn-back-home">
            <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            Zurück zur Übersicht
        </a>
    </nav>

    <div id="root"></div>

    <footer class="footer">
        Internes Beratungstool &nbsp;·&nbsp; Nur für den internen Gebrauch
    </footer>

    <script type="text/babel">
        // Make sure we have the dependencies available globally
        const { useState, useMemo } = React;
        const { AreaChart, Area, Line, ComposedChart, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer } = window.Recharts;

        const formatCurrency = (value) =>
            new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(value);

        const InfoIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className || "w-4 h-4 text-slate-400 hover:text-emerald-500 transition-colors"}><circle cx="12" cy="12" r="10" /><path d="M12 16v-4" /><path d="M12 8h.01" /></svg>
        );
        const CalculatorIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className || "w-5 h-5"}><rect width="16" height="20" x="4" y="2" rx="2" /><line x1="8" x2="16" y1="6" y2="6" /><line x1="16" x2="16" y1="14" y2="18" /><path d="M16 10h.01" /><path d="M12 10h.01" /><path d="M8 10h.01" /><path d="M12 14h.01" /><path d="M8 14h.01" /><path d="M12 18h.01" /><path d="M8 18h.01" /></svg>
        );
        const SlidersIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className || "w-5 h-5"}><line x1="4" x2="20" y1="21" y2="21"/><line x1="4" x2="20" y1="14" y2="14"/><line x1="4" x2="20" y1="7" y2="7"/><polyline points="14 17 14 21 18 21"/><polyline points="8 10 8 14 12 14"/><polyline points="14 3 14 7 18 7"/></svg>
        );
        const TrendingUpIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className || "w-5 h-5"}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17" /><polyline points="16 7 22 7 22 13" /></svg>
        );
        const ClockIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className || "w-5 h-5"}><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></svg>
        );
        const CheckCircleIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className || "w-5 h-5"}><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z" /><path d="m9 12 2 2 4-4" /></svg>
        );
        const PiggyBankIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className || "w-5 h-5"}><path d="M19 5c-1.5 0-2.8 1.4-3 2-3.5-1.5-11-.3-11 5 0 1.8 0 3 2 4.5V20h4v-2h3v2h4v-4c1-.5 1.5-1 2-2h2v-4h-2c0-1-.5-1.5-1-2h0V6c0-.5-.5-1-1-1z"/><path d="M2 9v1c0 1.1.9 2 2 2h1"/><path d="M16 11h.01"/></svg>
        );
        const EuroIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className || "w-5 h-5"}><path d="M4 10h12"/><path d="M4 14h9"/><path d="M19 6a7.7 7.7 0 0 0-5.2-2A7.9 7.9 0 0 0 6 12c0 4.4 3.5 8 7.8 8 2 0 3.8-.8 5.2-2"/></svg>
        );
        const ClockIcon2 = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className || "w-5 h-5"}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        );

        // Fallback if Recharts isn't perfectly loaded yet
        if (!window.Recharts || !window.Recharts.AreaChart) {
            console.error("Recharts could not be loaded from window.Recharts.");
        }

        const InputSlider = ({ label, value, onChange, min, max, step, suffix, prefix, isCurrency, infoText, isDark = false }) => {
            const getSuffix = (val, suf) => (val === 1 && suf === " Jahre") ? " Jahr" : suf;
            const displayValue = isCurrency ? formatCurrency(value) : (`${prefix}${new Intl.NumberFormat('de-DE').format(value)}${getSuffix(value, suffix)}`);

            return (
                <div className="space-y-5">
                    <div className="flex justify-between items-center">
                        <label className={`text-sm font-semibold flex items-center gap-1.5 ${isDark ? 'text-slate-200' : 'text-slate-700'}`}>
                            {label}
                            {infoText && (
                                <div className="group relative cursor-help">
                                    <InfoIcon />
                                    <div className="absolute left-1/2 -translate-x-1/2 bottom-full mb-2 w-48 p-2 bg-slate-800 text-white text-xs rounded-lg opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all z-10 text-center shadow-xl">
                                        {infoText}
                                        <div className="absolute -bottom-1 left-1/2 -translate-x-1/2 w-2 h-2 bg-slate-800 rotate-45"></div>
                                    </div>
                                </div>
                            )}
                        </label>
                        <div className={`font-bold px-3 py-1 rounded-lg whitespace-nowrap ${isDark ? 'text-white bg-white/10' : 'text-slate-900 bg-slate-100'}`}>
                            {displayValue}
                        </div>
                    </div>
                    <div>
                        <input
                            type="range"
                            min={min}
                            max={max}
                            step={step || 1}
                            value={value}
                            onChange={(e) => onChange(Number(e.target.value))}
                            style={{ background: `linear-gradient(to right, ${isDark ? '#38bdf8' : '#023e84'} 0%, ${isDark ? '#38bdf8' : '#023e84'} ${((value - min) / (max - min)) * 100}%, ${isDark ? 'rgba(255,255,255,0.1)' : '#e5e7eb'} ${((value - min) / (max - min)) * 100}%, ${isDark ? 'rgba(255,255,255,0.1)' : '#e5e7eb'} 100%)` }}
                            className={isDark ? 'dark-slider' : ''}
                        />
                        <div className={`flex justify-between text-xs mt-1 font-medium ${isDark ? 'text-slate-400' : 'text-slate-400'}`}>
                            <span>{isCurrency ? formatCurrency(min) : (prefix + min + getSuffix(min, suffix))}</span>
                            <span>{isCurrency ? formatCurrency(max) : (prefix + max + getSuffix(max, suffix))}</span>
                        </div>
                    </div>
                </div>
            );
        };

        const CustomTooltip = ({ active, payload, label }) => {
            if (active && payload && payload.length) {
                const data = payload[0].payload;
                return (
                    <div className="bg-white/95 backdrop-blur-sm shadow-xl p-4 rounded-xl border border-slate-100">
                        <p className="font-bold text-slate-800 mb-3 border-b border-slate-100 pb-2">Nach {label} {label === 1 ? 'Jahr' : 'Jahren'}</p>
                        <div className="space-y-2">
                            <div className="flex justify-between items-center gap-6">
                                <span className="text-slate-500 flex items-center gap-1.5 font-medium"><div className="w-2 h-2 rounded-full" style={{ backgroundColor: '#646464' }}></div> Einzahlung:</span>
                                <span className="font-bold text-slate-800">{formatCurrency(data.eingezahlt)}</span>
                            </div>
                            <div className="flex justify-between items-center gap-6">
                                <span className="text-[#006fb9] flex items-center gap-1.5 font-medium"><div className="w-2 h-2 rounded-full" style={{ backgroundColor: '#006fb9' }}></div> Ertrag:</span>
                                <span className="font-bold text-slate-800">{formatCurrency(data.zinsen)}</span>
                            </div>
                            <div className="pt-2 mt-2 border-t border-slate-100 flex justify-between items-center gap-6">
                                <span className="text-[#023e84] flex items-center gap-1.5 font-bold"><div className="w-2 h-2 rounded-full" style={{ backgroundColor: '#023e84' }}></div> Endkapital:</span>
                                <span className="font-bold text-[#023e84]">{formatCurrency(data.kapital)}</span>
                            </div>
                        </div>
                    </div>
                );
            }
            return null;
        };

        const ZinseszinsRechner = () => {
            const [startkapital, setStartkapital] = useState(5000);
            const [sparrate, setSparrate] = useState(100);
            const [dauer, setDauer] = useState(10);
            const [rendite, setRendite] = useState(3.0);
            const [wartedauer, setWartedauer] = useState(5);

            const handleDauerChange = (newDauer) => {
                setDauer(newDauer);
                if (wartedauer > newDauer) {
                    setWartedauer(newDauer);
                }
            };

            const calculationData = useMemo(() => {
                let currentKapital = startkapital;
                let currentEingezahlt = startkapital;
                let currentSparrate = sparrate;
                const data = [];
                let breakEvenMonthTotal = null;

                data.push({
                    jahr: 0,
                    kapital: currentKapital,
                    eingezahlt: currentEingezahlt,
                    zinsen: 0,
                });

                const r = rendite / 100;

                for (let j = 1; j <= dauer; j++) {
                    const eingezahltJahr = currentSparrate * 12;
                    // Jährliche Zinsperiode: Vorjahreskapital wird voll verzinst, 
                    // monatliche Sparrate vorschüssig (78/12 = 6,5 Zinsmonate)
                    const zinsenJahr = currentKapital * r + currentSparrate * r * 6.5;

                    currentKapital += eingezahltJahr + zinsenJahr;
                    currentEingezahlt += eingezahltJahr;

                    if (breakEvenMonthTotal === null && (currentKapital - currentEingezahlt) > currentEingezahlt && currentEingezahlt > 0) {
                        breakEvenMonthTotal = j * 12;
                    }

                    data.push({
                        jahr: j,
                        kapital: Math.round(currentKapital),
                        eingezahlt: Math.round(currentEingezahlt),
                        zinsen: Math.round(currentKapital - currentEingezahlt),
                    });
                }

                let waitingKapital = 0;
                if (dauer > wartedauer) {
                    let wKapital = startkapital;
                    for (let j = 1; j <= (dauer - wartedauer); j++) {
                        const eingezahltJahrW = sparrate * 12;
                        const zinsenJahrW = wKapital * r + sparrate * r * 6.5;
                        wKapital += eingezahltJahrW + zinsenJahrW;
                    }
                    waitingKapital = Math.round(wKapital);
                } else if (dauer <= wartedauer && dauer > 0) {
                    waitingKapital = startkapital;
                }

                const finalData = data[data.length - 1];
                const kostenDesWartens = finalData.kapital - waitingKapital;

                return {
                    chartData: data,
                    endkapital: finalData.kapital,
                    eingezahltTotal: finalData.eingezahlt,
                    zinsenTotal: finalData.zinsen,
                    breakEvenMonthTotal,
                    kostenDesWartens
                };
            }, [startkapital, sparrate, dauer, rendite, wartedauer]);

            const { chartData, endkapital, eingezahltTotal, zinsenTotal, breakEvenMonthTotal, kostenDesWartens } = calculationData;

            const entgangenerErtrag = kostenDesWartens - (sparrate * 12 * Math.min(wartedauer, dauer));

            const generateMilestones = (d, dta) => {
                if (d < 4) return dta.slice(-d);
                const m1 = Math.round(d * 0.26);
                const m2 = Math.round(d * 0.5);
                const m3 = Math.round(d * 0.76);
                const m4 = d;
                const indices = [m1, m2, m3, m4].map(y => dta.findIndex(x => x.jahr === y)).filter(i => i !== -1);
                if (indices.length < 4) return dta.slice(-4);
                return indices.map(i => dta[i]);
            };
            const milestones = generateMilestones(dauer, chartData);

            return (
                <div className="grid grid-cols-1 lg:grid-cols-[340px_1fr] gap-6 xl:gap-8 pt-6">
                    {/* TOP LEFT: Inputs */}
                    <div className="bg-white p-6 rounded-3xl shadow-[0_2px_12px_rgba(2,62,132,0.05)] border border-slate-100 flex flex-col gap-6 lg:row-span-1">
                        <div className="flex items-center gap-3">
                            <div className="p-2.5 bg-[#006fb9]/10 text-[#006fb9] rounded-xl">
                                <SlidersIcon />
                            </div>
                            <h2 className="text-xl font-bold text-[#023e84]">Eingabe</h2>
                        </div>
                        
                        <InputSlider label="Einmalanlagebetrag" value={startkapital} onChange={setStartkapital} min={0} max={250000} step={1000} isCurrency={true} prefix="" suffix=" €" infoText="" />
                        <InputSlider label="Monatlicher Beitrag" value={sparrate} onChange={setSparrate} min={0} max={1000} step={50} isCurrency={true} prefix="" suffix=" € / Monat" infoText="" />
                        <InputSlider label="Rendite p.a." value={rendite} onChange={setRendite} min={0.5} max={10} step={0.5} suffix=" %" prefix="" isCurrency={false} infoText="" />
                        <InputSlider label="Anlagedauer" value={dauer} onChange={handleDauerChange} min={1} max={50} step={1} suffix=" Jahre" prefix="" isCurrency={false} infoText="" />
                    </div>

                    {/* TOP RIGHT: Results & Chart */}
                    <div className="flex flex-col gap-6 min-w-0 lg:row-span-1">
                        {/* Top 3 Cards */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div className="bg-white p-5 rounded-3xl shadow-[0_2px_12px_rgba(2,62,132,0.05)] border border-slate-100 flex flex-col relative overflow-hidden">
                                <div className="flex justify-between items-start mb-1">
                                    <span className="text-sm font-medium text-slate-500">Gesamte Einzahlungen</span>
                                    <div className="p-2 bg-[#006fb9]/10 text-[#006fb9] rounded-lg">
                                        <PiggyBankIcon className="w-5 h-5" />
                                    </div>
                                </div>
                                <div className="text-2xl font-bold text-[#023e84]">{formatCurrency(eingezahltTotal)}</div>
                                <div className="text-xs text-[#006fb9] mt-1 font-medium">über {dauer} Jahre</div>
                            </div>
                            <div className="bg-white p-5 rounded-3xl shadow-[0_2px_12px_rgba(2,62,132,0.05)] border border-slate-100 flex flex-col relative overflow-hidden">
                                <div className="flex justify-between items-start mb-1">
                                    <span className="text-sm font-medium text-slate-500">Ertrag</span>
                                    <div className="p-2 bg-[#006fb9]/10 text-[#006fb9] rounded-lg">
                                        <TrendingUpIcon className="w-5 h-5" />
                                    </div>
                                </div>
                                <div className="text-2xl font-bold text-[#023e84]">{formatCurrency(zinsenTotal)}</div>
                                <div className="text-xs text-[#006fb9] mt-1 font-medium">{((zinsenTotal / endkapital) * 100).toFixed(0)}% des Endkapitals</div>
                            </div>
                            <div className="bg-white p-5 rounded-3xl shadow-[0_2px_12px_rgba(2,62,132,0.05)] border border-slate-100 flex flex-col relative overflow-hidden">
                                <div className="flex justify-between items-start mb-1">
                                    <span className="text-sm font-medium text-slate-500">Endkapital</span>
                                    <div className="p-2 bg-[#006fb9]/10 text-[#006fb9] rounded-lg">
                                        <EuroIcon className="w-5 h-5" />
                                    </div>
                                </div>
                                <div className="text-2xl font-bold text-[#023e84]">{formatCurrency(endkapital)}</div>
                                <div className="text-xs text-[#006fb9] mt-1 font-medium">x{(endkapital / (eingezahltTotal || 1)).toFixed(1)} Vervielfachung</div>
                            </div>
                        </div>

                        {/* Chart Box */}
                        <div className="bg-white p-6 rounded-3xl shadow-[0_2px_12px_rgba(2,62,132,0.05)] border border-slate-100 flex-1 flex flex-col min-h-[400px]">
                            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                                <h3 className="text-lg font-bold text-[#023e84] m-0">Vermögensentwicklung</h3>
                                <div className="flex items-center gap-4 text-xs font-medium text-slate-500">
                                    <div className="flex items-center gap-1.5"><div className="w-2.5 h-2.5 rounded-sm bg-[#646464]"></div>Einzahlungen</div>
                                    <div className="flex items-center gap-1.5"><div className="w-2.5 h-2.5 rounded-sm bg-[#006fb9]"></div>Ertrag</div>
                                    <div className="flex items-center gap-1.5"><div className="w-2.5 h-2.5 rounded-sm bg-[#023e84]"></div>Endkapital</div>
                                </div>
                            </div>
                            <div className="flex-1 w-full relative h-[300px]">
                                <ResponsiveContainer width="100%" height="100%">
                                    <ComposedChart data={chartData} margin={{ top: 10, right: 10, left: 0, bottom: 0 }}>
                                        <defs>
                                            <linearGradient id="colorKapitalNew" x1="0" y1="0" x2="0" y2="1">
                                                <stop offset="5%" stopColor="#023e84" stopOpacity={0.4} />
                                                <stop offset="95%" stopColor="#023e84" stopOpacity={0.1} />
                                            </linearGradient>
                                            <linearGradient id="colorEinzahlungNew" x1="0" y1="0" x2="0" y2="1">
                                                <stop offset="5%" stopColor="#646464" stopOpacity={0.4} />
                                                <stop offset="95%" stopColor="#646464" stopOpacity={0.1} />
                                            </linearGradient>
                                        </defs>
                                        <XAxis dataKey="jahr" axisLine={false} tickLine={false} tick={{ fontSize: 11, fill: '#94a3b8' }} dy={10} tickFormatter={(val) => val === 0 ? 'Start' : `${val}J`} />
                                        <YAxis
                                            tickFormatter={(val) => `${val >= 1000 ? val/1000 + 'k' : val} €`}
                                            axisLine={false}
                                            tickLine={false}
                                            tick={{ fill: '#94a3b8', fontSize: 11 }}
                                            dx={-10}
                                            width={60}
                                        />
                                        <Tooltip content={<CustomTooltip />} />
                                        <Area type="monotone" dataKey="kapital" stroke="#023e84" strokeWidth={2} fill="url(#colorKapitalNew)" />
                                        <Area type="monotone" dataKey="eingezahlt" stroke="#646464" strokeWidth={2} fill="url(#colorEinzahlungNew)" />
                                        <Line type="monotone" dataKey="zinsen" stroke="#006fb9" strokeWidth={2} dot={false} activeDot={{ r: 4 }} />
                                    </ComposedChart>
                                </ResponsiveContainer>
                            </div>
                        </div>
                    </div>

                    {/* BOTTOM LEFT: Kosten des Wartens */}
                    <div className="bg-white p-6 rounded-3xl shadow-[0_2px_12px_rgba(2,62,132,0.05)] border border-slate-100 self-stretch lg:row-span-1 flex flex-col">
                        <div className="flex items-center gap-3 mb-4 text-slate-500">
                            <div className="p-2 bg-[#006fb9]/10 text-[#006fb9] rounded-lg">
                                <ClockIcon2 className="w-5 h-5" />
                            </div>
                            <h4 className="text-sm font-bold text-[#023e84] tracking-wider uppercase">Kosten des Wartens</h4>
                        </div>
                        
                        <div className="mb-6">
                            <InputSlider 
                                label="Ich warte noch..." 
                                value={wartedauer} 
                                onChange={setWartedauer} 
                                min={0} 
                                max={Math.min(10, dauer)} 
                                step={1} 
                                suffix={wartedauer === 1 ? " Jahr" : " Jahre"} 
                                prefix="" 
                                isCurrency={false} 
                                infoText="Geben Sie an, wie viele Jahre Sie noch mit dem Investieren warten möchten." 
                            />
                        </div>

                        <p className="text-3xl font-bold text-[#8b0000] mb-4 mt-auto">-{formatCurrency(kostenDesWartens)}</p>
                        <p className="text-sm text-slate-500 mb-2 leading-relaxed">
                            So viel weniger Endkapital haben Sie, wenn Sie {wartedauer === 1 ? "1 Jahr" : `${wartedauer} Jahre`} später beginnen.
                        </p>
                        <div className="flex justify-between text-sm mt-4 pt-4 border-t border-slate-100">
                            <span className="text-slate-500">Davon entgangener Ertrag</span>
                            <span className="text-[#8b0000] font-medium">-{formatCurrency(entgangenerErtrag)}</span> 
                        </div>
                    </div>

                    {/* BOTTOM RIGHT: Zeitfaktor */}
                    <div className="bg-white p-6 rounded-3xl shadow-[0_2px_12px_rgba(2,62,132,0.05)] border border-slate-100 self-stretch lg:row-span-1 flex flex-col justify-center">
                        <div className="flex items-center gap-3 mb-6">
                            <div className="p-2 bg-[#006fb9]/10 text-[#006fb9] rounded-lg">
                                <ClockIcon2 className="w-5 h-5" />
                            </div>
                            <h4 className="text-sm font-bold text-[#023e84] tracking-wider uppercase">Zeitfaktor — Der mächtigste Hebel</h4>
                        </div>
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                            {milestones.map((ms, i) => (
                                <div key={i} className="bg-slate-50 rounded-xl p-4 flex flex-col text-center border border-slate-100">
                                    <span className="text-slate-500 text-sm mb-2">Jahr {ms.jahr}</span>
                                    <span className="text-xl font-bold text-[#023e84] mb-3">{formatCurrency(ms.kapital)}</span>
                                    <div className="h-1 w-full bg-slate-200 rounded-full mb-2 overflow-hidden">
                                        <div className="h-full bg-[#006fb9] rounded-full" style={{ width: `${(ms.zinsen / (ms.kapital || 1)) * 100}%` }}></div>
                                    </div>
                                    <span className="text-[#006fb9] text-xs font-medium">Anteil des Ertrags: {((ms.zinsen / (ms.kapital || 1)) * 100).toFixed(0)}%</span>
                                </div>
                            ))}
                        </div>

                        <div className="bg-[#006fb9]/5 border border-[#006fb9]/10 rounded-2xl p-4 flex gap-3">
                            <div className="mt-0.5 shrink-0">
                                <InfoIcon className="w-5 h-5 text-[#006fb9]" />
                            </div>
                            <p className="text-sm text-slate-600 leading-relaxed">
                                <strong className="text-[#023e84]">Warum steigt der Ertragsanteil?</strong> Durch den Zinseszinseffekt generieren nicht nur Ihre eigenen Einzahlungen Erträge, sondern auch die bereits verdienten Zinsen der Vorjahre. Je länger Ihr Geld angelegt ist, desto stärker dominiert dieses exponentielle Wachstum das Endkapital.
                            </p>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => (
            <div className="max-w-7xl mx-auto px-4 md:px-6 lg:px-8 pt-4 pb-12 space-y-8">
                <div className="text-center mb-8">
                    <div className="page-eyebrow">Investment</div>
                    <h1 className="text-3xl md:text-4xl font-bold text-[#023e84] tracking-tight">
                        Zinseszins-Rechner
                    </h1>
                    <p className="text-sm md:text-base text-[#646464] mt-2 max-w-xl mx-auto">
                        Wie wirkt sich der Zinseszinseffekt auf Ihre Geldanlage aus? Simulieren Sie das Kapitalwachstum bei Einmalanlage und monatlichem Sparplan über verschiedene Laufzeiten.
                    </p>
                </div>
                <ZinseszinsRechner />
            </div>
        );

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);

    </script>
</body>

</html>
